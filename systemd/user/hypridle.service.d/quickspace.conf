# hypridle counts as started only once it owns org.freedesktop.ScreenSaver:
# Chrome uses the D-Bus inhibitor only if that name is already owned, so an
# app started earlier would silently lose its inhibits (SPEC.md §5.4).
# quickspace.service Wants= hypridle, so nothing needs to enable it; enabling
# its own [Install] would start it under Plasma too.
[Service]
Type=dbus
BusName=org.freedesktop.ScreenSaver
# Fail fast if it never claims the name, rather than systemd's 90 s default,
# so the shell starts without it.
TimeoutStartSec=10
