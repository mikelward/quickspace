# A drop-in for another desktop's autostarted polkit agent: it skips the agent
# in the quickspace session, and only there. quickspace-shell runs the
# session's agent (SPEC.md §5.4), and polkit takes one agent per session, so a
# second one either fails itself or, started first, makes the shell's fail.
# `make install` puts it on each generated autostart unit in POLKIT_AUTOSTART.
[Service]
ExecCondition=/bin/sh -c 'case ":$${XDG_CURRENT_DESKTOP}:" in *:quickspace:*) exit 1 ;; esac'
