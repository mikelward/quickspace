# XDG autostart is an allowlist in quickspace (SPEC.md §5.4). systemd's
# xdg-autostart generator runs each entry as app-<id>@autostart.service, and
# this prefix drop-in reaches every one of them, so an entry installed later
# for another desktop is covered too: in the quickspace session it runs only
# if `quickspace autostart-allowed` says so. Every other app-*.service, and
# every unit outside quickspace, Plasma's included, passes without running
# anything but this shell's case. systemd skips a unit whose condition exits
# 1 to 254, so only the helper's 1 ("not allowed") is passed on: a helper that
# can't run (127) or fails otherwise exits 255, which fails the unit
# visibly rather than silently dropping every autostart entry.
[Service]
ExecCondition=/bin/sh -c 'case ":$${XDG_CURRENT_DESKTOP}:%n" in *:quickspace:*@autostart.service) quickspace autostart-allowed "%n"; s=$$?; test "$$s" -le 1 && exit "$$s"; echo "quickspace autostart-allowed failed ($$s) for %n" >&2; exit 255 ;; esac'
